<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wyniki — BlazePL007</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css?v=4"></head><body><div id="site-navbar"></div><script src="assets/js/navbar.js?v=4"></script><main class="wrap"><section><div class="head"><div><div class="eyebrow">STATYSTYKI TURNIEJU</div><h2>MVP I KLASYFIKACJA MAP</h2><p>Indywidualne wyróżnienia oraz mapy rozegrane podczas IV Turnieju w CS.</p></div></div><div id="tournamentPublic" class="panel"><p class="note">Ładowanie statystyk…</p></div></section></main><footer><div class="wrap foot"><span>© 2026 BLAZEPL007 · TURNIEJ CS2</span><a href="https://www.twitch.tv/blazepl007" target="_blank" rel="noopener">TWITCH</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{
 const btn=document.getElementById("accountNavBtn");
 const adminBtn=document.getElementById("adminNavBtn");
 if(!btn || !window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY || window.SUPABASE_PUBLISHABLE_KEY.includes("WSTAW_TUTAJ")) return;
 const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});
 let checkId=0;
 const update=async session=>{
   const signedIn=!!session?.user;
   btn.textContent=signedIn?"KONTO":"LOGOWANIE";
   btn.href=signedIn?"register.html":"login.html";
   if(adminBtn){adminBtn.classList.add("hidden");if(signedIn){const id=++checkId;try{const {data,error}=await db.rpc("is_admin_member");if(id===checkId&&!error&&data===true)adminBtn.classList.remove("hidden");}catch(_){/* nie udało się sprawdzić członkostwa administratora — przycisk pozostaje ukryty */}}}
 };
 db.auth.getSession().then(({data})=>update(data.session));
 db.auth.onAuthStateChange((_event,session)=>update(session));
})();
</script>
<script src="tournament-stats.js"></script></body></html>
