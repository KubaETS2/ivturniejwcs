<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drużyny — BlazePL007</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css?v=3"></head><body><div id="site-navbar"></div><script src="assets/js/navbar.js"></script><main class="wrap"><section><div class="head"><div><div class="eyebrow">UCZESTNICY TURNIEJU</div><h2>ZAKWALIFIKOWANE DRUŻYNY</h2><p>Lista zespołów zatwierdzonych przez organizatora.</p></div><a class="btn" href="register.html">ZAPISZ DRUŻYNĘ</a></div><div id="teams" class="teamlist"><div class="panel note">Ładowanie drużyn…</div></div></section></main><footer><div class="wrap foot"><span>© 2026 BLAZEPL007 · TURNIEJ CS2</span><a href="https://www.twitch.tv/blazepl007" target="_blank" rel="noopener">TWITCH</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{
 const btn=document.getElementById("accountNavBtn");
 const adminBtn=document.getElementById("adminNavBtn");
 if(!btn || !window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY || window.SUPABASE_PUBLISHABLE_KEY.includes("WSTAW_TUTAJ")) return;
 const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});
 let checkId=0;
 const update=async session=>{
   const signedIn=!!session?.user;
   btn.textContent=signedIn?"KONTO":"LOGOWANIE";
   btn.href=signedIn?"register.html":"login.html";
   if(adminBtn){adminBtn.classList.add("hidden");if(signedIn){const id=++checkId;try{const {data,error}=await db.rpc("is_admin_member");if(id===checkId&&!error&&data===true)adminBtn.classList.remove("hidden");}catch(_){/* nie udało się sprawdzić członkostwa administratora — przycisk pozostaje ukryty */}}}
 };
 db.auth.getSession().then(({data})=>update(data.session));
 db.auth.onAuthStateChange((_event,session)=>update(session));
})();
</script>
<script>
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{
 const root=document.querySelector("#teams");
 try{
  if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_PUBLISHABLE_KEY) throw new Error("Brak konfiguracji połączenia z bazą.");
  const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
  const {data:rows,error}=await db.from("teams").select("id,name,captain,players,reserve,logo_url,description").eq("status","approved").order("created_at",{ascending:true});
  if(error) throw error;
  root.innerHTML=rows?.length?rows.map(t=>`<article class="teamcard team-card-full"><div class="team-card-main">${t.logo_url?`<img class="team-emblem" src="${safe(t.logo_url)}" alt="Logo ${safe(t.name)}" loading="lazy" onerror="this.style.display='none'">`:`<div class="team-emblem team-emblem-fallback">${safe((t.name||"?").slice(0,1).toUpperCase())}</div>`}<div class="team-card-info"><small>ZATWIERDZONA DRUŻYNA</small><strong>${safe(t.name)}</strong><span class="team-captain">Kapitan: ${safe(t.captain||"—")}</span>${Array.isArray(t.players)&&t.players.length?`<span class="team-players">Skład: ${t.players.map(safe).join(" · ")}</span>`:""}${t.description?`<p class="team-description">${safe(t.description)}</p>`:""}</div></div><span class="tag">CS2 · 5V5</span></article>`).join(""):'<div class="panel note">Brak zatwierdzonych drużyn.</div>';
 }catch(e){root.innerHTML=`<div class="panel note">Nie udało się wczytać zatwierdzonych drużyn. ${safe(e.message||"")}</div>`;}
})();
</script></body></html>
