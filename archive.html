<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archiwum turniejów | BLAZEPL007</title><link rel="stylesheet" href="assets/css/style.css?v=7"></head><body><div id="site-navbar"></div><script src="assets/js/navbar.js?v=7"></script><main class="wrap"><section><div class="head"><div><div class="eyebrow">HISTORIA ROZGRYWEK</div><h2>ARCHIWUM TURNIEJÓW</h2><p>Zakończone edycje dostępne bez logowania i bez połączenia z bazą danych.</p></div></div><div class="panel"><div class="field"><label for="editionSelect">WYBIERZ EDYCJĘ</label><select id="editionSelect"><option value="">Ładowanie archiwum…</option></select></div><div id="archiveContent"><p class="note">Wybierz edycję, aby zobaczyć dane.</p></div></div></section></main><footer><div class="wrap foot"><span>© BLAZEPL007 · ARCHIWUM TURNIEJÓW</span><a href="home.html">STRONA GŁÓWNA</a></div></footer><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script>
(()=>{const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const parse=async path=>{const r=await fetch(path);if(!r.ok)throw new Error("Nie znaleziono pliku "+path);return Papa.parse(await r.text(),{header:true,skipEmptyLines:true}).data};const val=v=>{try{return JSON.stringify(JSON.parse(v))}catch{return v}};const section=(title,rows,cols)=>`<details class="tourney-accordion" open><summary>${esc(title)}</summary><div class="tourney-content"><div class="table-scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[2]?val(r[c[0]]):r[c[0]])}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${cols.length}">Brak danych.</td></tr>`}</tbody></table></div></div></details>`;async function show(y){const root=$("#archiveContent");root.innerHTML="<p class=note>Wczytywanie archiwum…</p>";try{const p="archive/"+encodeURIComponent(y)+"/",files=await Promise.all(["metadata.json","teams.csv","matches.csv","standings.csv","playoffs.csv","final-standings.csv","mvp.csv","audience.csv","maps.csv"].map(async f=>{if(f.endsWith(".json")){const r=await fetch(p+f);return r.ok?r.json():{}}return parse(p+f)}));const [meta,teams,matches,standings,playoffs,finals,mvp,audience,maps]=files;let h=`<div class="eyebrow">EDYCJA ${esc(y)}</div><p class="note">${teams.length} drużyn · eksport ${esc(meta.exportedAt||"")}</p>`;h+=section("DRUŻYNY",teams,[["name","Drużyna"],["captain","Kapitan"],["players","Zawodnicy",true],["reserve","Rezerwowi",true]]);h+=section("TABELE GRUPOWE",standings,[["group","Grupa"],["place","Miejsce"],["name","Drużyna"],["M","Mecze"],["W","Wygrane"],["R","Remisy"],["P","Porażki"],["rf","Rundy +"],["ra","Rundy -"],["Pkt","Punkty"]]);h+=section("WYNIKI FAZY GRUPOWEJ",matches.filter(x=>x.stage==="group"||x.group),[["group","Grupa"],["team1","Drużyna 1"],["team2","Drużyna 2"],["maps","Wyniki map",true],["date","Data"]]);h+=section("PLAY-OFFY",playoffs,[["round","Runda"],["team1","Drużyna 1"],["team2","Drużyna 2"],["maps","Wyniki map",true],["winnerName","Zwycięzca"]]);h+=section("KLASYFIKACJA KOŃCOWA",finals,[["place","Miejsce"],["name","Drużyna"]]);h+=section("MVP",mvp,[["player","Zawodnik"],["count","MVP"]]);h+=section("NAGRODA PUBLICZNOŚCI",audience,[["player","Zawodnik"],["count","Punkty"]]);h+=section("STATYSTYKI MAP",maps,[["name","Mapa"],["count","Rozegrania"],["image","Obrazek"]]);root.innerHTML=h}catch(e){root.innerHTML=`<p class="note">${esc(e.message)}</p><p class="note">Rozpakuj folder archive/ z paczki eksportu do głównego katalogu repozytorium.</p>`}}fetch("archive/index.json").then(r=>r.ok?r.json():{editions:[]}).then(d=>{const ys=d.editions||[];$("#editionSelect").innerHTML=ys.length?ys.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join(""):'<option value="">Brak archiwów</option>';if(ys.length)show(ys[0]);else $("#archiveContent").innerHTML='<p class="note">Nie dodano jeszcze żadnych archiwów.</p>'}).catch(()=>{$("#editionSelect").innerHTML='<option value="">Brak archiwów</option>'});$("#editionSelect").addEventListener("change",e=>e.target.value&&show(e.target.value))})();</script></body></html>
